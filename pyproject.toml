[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ClashRoyaleBuildABot"
version = "0.1.0"
authors = [
  {name = "pbatch"},
]
description = "A platform for creating bots to play Clash Royale"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.5",
    "pillow==13.0.0",
    "keyboard==0.13.5",
    "scipy==1.18.1",
    "loguru==0.8.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "pyqt6==6.12.1",
    "av==19.0.2",
    "tqdm==4.70.1",
]
[project.optional-dependencies]
cpu = [
    "onnxruntime==1.32.0",
]
gpu = [
    "onnxruntime-gpu==1.32.0",
]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "ty==0.0.105",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP006", "UP007", "UP035", "UP045"]
ignore = ["E501", "E231", "E222"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
