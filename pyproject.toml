[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ClashRoyaleBuildABot"
version = "0.1.0"
authors = [
  {name = "pbatch"},
]
description = "A platform for creating bots to play Clash Royale"
readme = "README.md"
requires-python = "==3.12.*"
# Linux only: vLLM, which serves the vision model, doesn't run elsewhere.
classifiers = [
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy==2.3.5",
    "opencv-python-headless==5.1.0.95",
    "keyboard==0.13.5",
    "scipy==1.18.1",
    "loguru==0.8.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "openai==3.54.0",
    "pyqt6==6.12.1",
    "av==19.0.2",
    "tqdm==4.70.1",
    "huggingface-hub==2.4.0",
    "pydantic==2.12.5",
    "onnxruntime-gpu==1.32.0",
    "vllm==0.34.0",
]
[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "ty==0.0.105",
]

[tool.uv]
# Only resolve for Linux, and fail to lock if a dependency has no x86-64
# Linux wheel.
environments = ["sys_platform == 'linux'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "PERF", "FURB",
    "LOG", "G", "ISC", "T20", "W", "TC", "RUF", "PT", "PLW1510", "TID251",
    "ANN",
]
ignore = ["E501", "E231", "E222"]

[tool.ruff.lint.per-file-ignores]
# Annotating pytest functions and fixtures adds little.
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# vLLM still installs Pillow, so an import of it would work by accident.
"PIL".msg = "Frames are numpy arrays; use OpenCV (clashroyalebuildabot.utils.image)."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the suite, so leaks like an unclosed pipe get noticed.
filterwarnings = ["error"]
