[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ClashRoyaleBuildABot"
version = "0.1.0"
authors = [
  {name = "pbatch"},
]
description = "A platform for creating bots to play Clash Royale"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "flatbuffers==2.0",
    "numpy==2.4.6",
    "pillow==12.2.0",
    "protobuf==7.35.1",
	"keyboard==0.13.5",
    "scipy==1.17.1",
    "rich==13.7.1",
    "loguru==0.7.3",
    "PyYAML==6.0.3",
    "pybind11==3.0.4",
    "requests==2.34.2",
    "pyqt6==6.11.0",
    "av==17.1.0",
    "tqdm==4.68.2",
    "opencv-python==4.13.0.92",
]
[project.optional-dependencies]
cpu = [
    "onnxruntime==1.26.0",
]
gpu = [
    "onnxruntime-gpu==1.26.0",
]
dev = [
    "pre-commit==4.6.0",
    "ruff==0.15.17",
    "ty==0.0.49",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E231", "E222"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
