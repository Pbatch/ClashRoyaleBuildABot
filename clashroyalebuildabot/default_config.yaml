# Default settings. Don't edit this file: updates will overwrite it.
# To change a setting, put it in config.yaml in the project folder (the
# GUI's "Save config to file" button creates it). You only need the settings
# you want to change, for example:
#
#   ingame:
#     play_action: 1.5

bot:
  # The logging level for the bot.
  # Use "DEBUG" for detailed debugging information, "INFO" for general information,
  # "WARNING" for warning messages, "ERROR" for error messages, and "CRITICAL" for critical issues.
  log_level: "DEBUG"

  # Create a deck code when the game starts
  load_deck: False
  auto_start_game: False

adb:
  # The serial number of your device
  # Use adb devices to obtain it
  device_serial: emulator-5554

visuals:
  # show_images displays the bot's current view in a GUI.
  # save_images saves the images seen by the bot.
  # save_labels saves the images along with the labels and the bot's perspective.
  save_labels: False
  save_images: False
  show_images: False

ingame:
  # After playing a card, the bot waits until the screen shows it played (it
  # leaves the hand, or elixir drops) before playing another, so it doesn't
  # play the same card twice. This is the longest it waits, in seconds, if
  # the screen never shows it, e.g. when the tap missed.
  play_action: 1
