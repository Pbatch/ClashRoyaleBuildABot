repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        files: \.(py|sh|rst|yml|yaml)$
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(py|sh|rst|yml|yaml)$
# Ruff and ty run the versions locked in uv.lock, so hooks and CI's lint
# job can't disagree. Install with: uv run pre-commit install
- repo: local
  hooks:
    - id: ruff-check
      name: ruff check
      entry: uv run --locked ruff check --force-exclude --fix
      language: system
      types_or: [python, pyi]
    - id: ruff-format
      name: ruff format
      entry: uv run --locked ruff format --force-exclude
      language: system
      types_or: [python, pyi]
    - id: ty
      name: ty check
      entry: uv run --locked ty check
      language: system
      types_or: [python, pyi]
      pass_filenames: false

ci:
    autofix_prs: true
    autoupdate_commit_msg: '[pre-commit.ci] autoupdate'
    autoupdate_schedule: monthly
