name: Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # Libraries Qt needs to start, even with the headless "offscreen" platform
    - name: Install Qt system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pytest
      # Several tests use threads; fail fast rather than hang if one deadlocks.
      timeout-minutes: 10
      env:
        QT_QPA_PLATFORM: offscreen
      run: uv run pytest
