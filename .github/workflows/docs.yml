name: Docs

# Builds the docs site from docs/ on every pull request, so a broken page
# fails before it's merged, and publishes it to GitHub Pages from main.
on:
  push:
    branches: [main]
    paths: [docs/**, zensical.toml, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, zensical.toml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    # Only the docs group: the docs don't need the bot installed.
    - name: Build the site
      run: uv run --only-group docs zensical build --strict --clean

    - name: Upload the site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5
